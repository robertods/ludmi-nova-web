<body class="lyrics-page">
  <div class="floating-layer" aria-hidden="true"></div>

  <header class="site-header">

      <span class="brand-mark">
        <img src="profile.png" alt="">
      </span>

    <nav class="site-nav" aria-label="Navegación principal">

    <section class="lyrics-intro" aria-labelledby="lyrics-title">

      <p>Explora las canciones de Ludmi Nova y encuentra la letra que estabas buscando.</p>
